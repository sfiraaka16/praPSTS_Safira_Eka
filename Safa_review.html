<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sudent task</title>
    
</head>
<body>
    <form>
        <h3>Student Event Registration</h3>
        <label>Full Name</label><br>
        <input type="text"><br>

        <label>Class</label><br>
        <select>
            <option>X-8</option>
            <option>X-9</option>
            <option>X-10</option>
        </select><br>

        <label>Email</label><br>
        <input type="email"><br>

        <label>Phone Number</label><br>
        <input type="number"><br>

        <label>Choose Activity</label><br>
        <select>
            <option>Competition</option>
            <option>Workshop</option>
            <option>Seminar</option>
            <option>Social Activity</option>
        </select><br>

        <label>Event Date</label><br>
        <input type="date"><br>

        <label>Gender</label><br>
        <input type="radio" name="gender">Male
        <input type="radio" name="gender">Female
        <br>

        <label>Favorite Activities</label><br>
        <input type="checkbox">Sports
        <input type="checkbox">Art
        <input type="checkbox">Technology
        <input type="checkbox">Music
        <br>

        <label>Reason for Joining</label><br>
        <textarea rows="5" cols="40">
        </textarea> <br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>

    
</body>
</html>
