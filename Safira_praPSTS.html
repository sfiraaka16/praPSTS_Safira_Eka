<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer Lab Reservation System</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-pink-50 p-6">

    <form class="max-w-xl mx-auto bg-white p-6 roudend-xl shadow-md">

        <h3 class="text-2xl font-bold text-center text-pink-600 mb-6">Student Registration Form</h3>
        <label class="block font=semibold text-pink-700 mb-2">Full Name</label>
        <input type="text" name="name" placeholder="Enter your name" 
        class="w-full border border-pink-300 rounded-lg px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-pink-400">
        <br>
        
        <label class="block font-semibold text-pink-700 mb-2">Status</label>
        <select class="w-full border border-pink-300 rounded-lg px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-pink-400">
        <br>
            <option>Teacher</option>
            <option>Student</option>
            <option>Organizations</option>
        </select><br>
       
        <label class="block font-semibold text-pink-700 mb-2" >Purpose</label>
        <input type="text" name="name" placeholder="Enter your purpose"
        class="w-full border border-pink-300 rounded-lg px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-pink-400">
        <br>
        
        <label class="block font-semibold text-pink-700 mb-2">Borrowed Lab</label>
        <div class="mb-4">
        <input type="radio" name="Borrowed Lab">
        <span class="mr-4">Software Lab</span> 
        <input type="radio" name="Borrowed Lab"> 
        <span>Hardware Lab</span>
        </div>
        
        <label class="block font-semibold text-pink-700 mb-2">Date of Use</label>
        <input type="date" class="w-full border border-pink-300 rounded-lg px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-pink-400">
        <br>
        
        <label class="block font-semibold text-pink-700 mb-2">Start Time</label>
        <input type="time" class="w-full border border-pink-300 rounded-lg px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-pink-400">
        <br>
        <label class="block font-semibold text-pink-700 mb-2">End Time</label>
        <input type="time" class="w-full border border-pink-300 rounded-lg px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-pink-400"><br>
        
        <label class="block font-semibold text-pink-700 mb-2">Number of Participants</label>
        <input type="number" name="number" placeholder="eg. 72"
        class="w-full border border-pink-300 rounded-lg px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-pink-400"><br>
        
        <label class="block font-semibold text-pink-700 mb-2">Special Requirements</label>
        <textarea rows="5" cols="40" placeholder="ex: need internet acces, proyektor" 
        class="w-full border border-pink-300 rounded-lg px-3 py-2 mb-4 focus:outline-none focus:ring-2 focus:ring-pink-400"></textarea><br>
        <button type="submit" 
        class="w-full bg-pink-500 text-white font-semibold py-3 rounded-lg hover:bg-pink-700">Submit</button>

    </form>
    
</html>
